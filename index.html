<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F141C" />
    <script>
      (() => {
        let saved
        try { saved = localStorage.getItem('pc-remote-theme') } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0f141c' : '#f8fafc')
      })()
    </script>
    <meta name="description" content="Seu Android vira o controle do PC. Mouse, teclado, mídia e arquivos pela sua rede Wi-Fi. Baixe grátis para Windows, Ubuntu 22.04, 24.04 e 26.04 LTS e Android." />
    <meta property="og:title" content="PC Remote | Seu Android vira o controle do PC" />
    <meta property="og:description" content="Transforme o Android em touchpad, teclado e controle de mídia para o PC. Conexão local, gratuita e de código aberto." />
    <meta property="og:type" content="website" />
    <link rel="preload" as="image" href="/screenshots/desktop.webp" fetchpriority="high" />
    <link rel="icon" type="image/svg+xml" href="/brand/symbol.svg" />
    <link rel="canonical" href="https://pc-remote-app.vercel.app/" />
    <meta property="og:url" content="https://pc-remote-app.vercel.app/" />
    <meta property="og:image" content="https://pc-remote-app.vercel.app/screenshots/desktop.webp" />
    <title>PC Remote | Controle seu PC pelo Android, grátis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
